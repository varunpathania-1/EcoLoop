<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Become a Collector · EcoLoop</title>
  <link rel="stylesheet" href="/css/style.css?v=5">
  <link rel="stylesheet" href="/css/loader.css">
  <script>document.documentElement.classList.add('eco-boot');</script>
</head>
<body class="admin-page collector-application-page">
  <main class="admin-login-shell">
    <section class="admin-login-card collector-application-card">
      <a class="ecoloop-brand" href="/"><span class="ecoloop-brand-mark" aria-hidden="true">♻</span><span>EcoLoop <small>Collection partner</small></span></a>
      <div class="admin-login-heading"><p class="admin-eyebrow">Join the network</p><h1>Register as a collector</h1><p>Apply to help households recycle more responsibly.</p></div>
      <div id="collector-application-alert" class="hidden"></div>
      <form id="collector-application-form" class="admin-form">
        <label>Full name<input id="application-name" required></label>
        <label>Email<input type="email" id="application-email" required></label>
        <label>Phone<input id="application-phone" required></label>
        <label>Address<textarea id="application-address" rows="2" required></textarea></label>
        <label>Vehicle type<input id="application-vehicle" placeholder="Bike, van, auto..." required></label>
        <label>Verification information<input id="application-verification" placeholder="ID or license reference" required></label>
        <label>Password<input type="password" id="application-password" minlength="6" required></label>
        <button class="admin-primary-button" type="submit">Submit application <span aria-hidden="true">→</span></button>
      </form>
      <a class="admin-back-link" href="/login.html">← Back to login</a>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/loader.js"></script>
  <script src="/js/collector-register.js"></script>
</body>
</html>
