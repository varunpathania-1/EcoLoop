<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collector · EcoLoop</title>
  <link rel="stylesheet" href="/css/style.css?v=5">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/loader.css">
  <script>document.documentElement.classList.add('eco-boot');</script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/pickup-map.js"></script>
</head>
<body class="collector-page">
  <nav class="nav home-nav" aria-label="Primary">
    <div class="home-nav-inner">
      <a class="logo home-logo" href="/"><span class="home-logo-mark" aria-hidden="true">♻</span>EcoLoop</a>
      <div class="home-center-links" aria-label="Sections" hidden></div>
      <div class="home-quick-links" id="home-quick-links" aria-label="Quick actions" hidden></div>
      <div class="home-actions-nav">
        <div class="home-profile hidden" id="home-profile">
          <button class="home-profile-button" type="button" id="home-profile-button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">
            <span class="home-profile-avatar" id="home-profile-avatar" aria-hidden="true">•</span>
            <span class="home-profile-name" id="home-profile-name"></span>
            <span class="home-profile-chevron" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
          </button>
          <div class="home-profile-menu" id="home-profile-menu" role="menu" hidden>
            <div class="home-profile-meta"><strong id="home-profile-fullname"></strong><span id="home-profile-role"></span></div>
            <div id="home-profile-links"></div>
            <button class="home-profile-item home-profile-logout" type="button" data-logout><span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>Logout</span></button>
          </div>
        </div>
      </div>
      <button class="home-menu-button" type="button" id="home-menu-button" aria-label="Open menu" aria-expanded="false" aria-controls="home-mobile-menu">
        <span class="home-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
    <div class="home-mobile-menu" id="home-mobile-menu">
      <div class="home-mobile-profile hidden" id="home-mobile-profile"></div>
    </div>
  </nav>
  <section class="page">
    <div class="collector-header"><div><p class="collector-eyebrow">Collection operations</p><h1 id="greeting">Collector dashboard</h1><p class="collector-subtitle">Keep every pickup moving through the loop.</p></div><label class="collector-availability">Availability<select id="collector-availability"><option value="available">Available</option><option value="offline">Offline</option><option value="busy">Busy</option></select></label></div>
    <div id="alert" class="hidden"></div>
    <div class="collector-stats">
      <div class="card collector-stat"><span class="collector-stat-icon scheduled">◷</span><div><span>Scheduled Pickups</span><strong id="scheduled-pickups">0</strong></div></div>
      <div class="card collector-stat"><span class="collector-stat-icon completed">✓</span><div><span>Completed Pickups</span><strong id="completed-pickups">0</strong></div></div>
      <div class="card collector-stat"><span class="collector-stat-icon kg">♻</span><div><span>Total KG Collected</span><strong id="total-kg">0.00 kg</strong></div></div>
      <div class="card collector-stat"><span class="collector-stat-icon amount">₹</span><div><span>Total Amount</span><strong id="total-amount">₹0.00</strong></div></div>
    </div>
  </section>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/collector.js"></script>
  <script>
    if (typeof initNavbar === 'function') initNavbar();
  </script>
</body>
</html>
