<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History · EcoLoop</title>
  <link rel="stylesheet" href="/css/style.css?v=5">
  <link rel="stylesheet" href="/css/loader.css">
  <script>document.documentElement.classList.add('eco-boot');</script>
</head>
<body class="history-page">
  <nav class="nav home-nav" aria-label="Primary">
    <div class="home-nav-inner">
      <a class="logo home-logo" href="/"><span class="home-logo-mark" aria-hidden="true">♻</span>EcoLoop</a>
      <div class="home-center-links" aria-label="Sections" hidden></div>
      <div class="home-quick-links" id="home-quick-links" aria-label="Quick actions" hidden></div>
      <div class="home-actions-nav">
        <div class="home-profile hidden" id="home-profile">
          <button class="home-profile-button" type="button" id="home-profile-button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">
            <span class="home-profile-avatar" id="home-profile-avatar" aria-hidden="true">•</span>
            <span class="home-profile-name" id="home-profile-name"></span>
            <span class="home-profile-chevron" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
          </button>
          <div class="home-profile-menu" id="home-profile-menu" role="menu" hidden>
            <div class="home-profile-meta"><strong id="home-profile-fullname"></strong><span id="home-profile-role"></span></div>
            <div id="home-profile-links"></div>
            <button class="home-profile-item home-profile-logout" type="button" data-logout><span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>Logout</span></button>
          </div>
        </div>
      </div>
      <button class="home-menu-button" type="button" id="home-menu-button" aria-label="Open menu" aria-expanded="false" aria-controls="home-mobile-menu">
        <span class="home-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
    <div class="home-mobile-menu" id="home-mobile-menu">
      <div class="home-mobile-profile hidden" id="home-mobile-profile"></div>
    </div>
  </nav>
  <div class="dashboard-shell">

    <main class="dashboard-main">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Resident space</p>
          <h1>Pickup history</h1>
          <p class="dashboard-subtitle">View and track all your EcoLoop pickups.</p>
        </div>
        <a class="btn dashboard-action" href="/book-pickup.html"><span aria-hidden="true">＋</span> Book a pickup</a>
      </header>
      <div id="alert" class="hidden"></div>
      <section class="history-surface">
        <div class="history-surface-header">
          <div>
            <p class="eyebrow">All activity</p>
            <h2>Pickup history</h2>
          </div>
        </div>
        <div class="history-toolbar">
          <input type="search" id="history-search" placeholder="Search pickups..." autocomplete="off" aria-label="Search pickups">
          <button type="button" id="pickupHistoryFilterButton" aria-label="Open filters" aria-expanded="false" aria-controls="pickupHistoryFilterPanel"><span>⚙</span><span>Filters</span><span id="history-filters-badge" hidden></span></button>
        </div>
        <div class="history-chips" id="history-chips" aria-live="polite"></div>
        <p class="history-count" id="history-count" aria-live="polite"></p>
        <div class="history-table-wrap">
          <table class="history-table">
            <colgroup>
              <col style="width:14%">
              <col style="width:16%">
              <col style="width:10%">
              <col style="width:11%">
              <col style="width:9%">
              <col style="width:28%">
              <col style="width:12%">
            </colgroup>
            <thead>
              <tr>
                <th>Date</th>
                <th>Materials</th>
                <th>Weight</th>
                <th>Amount</th>
                <th>Points</th>
                <th>Progress</th>
                <th>Payment</th>
              </tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
        <div class="history-surface-footer"><span class="history-footer-dot" aria-hidden="true"></span> Every pickup helps keep useful materials in the loop.</div>
      </section>
    </main>
  </div>
  <div id="pickupHistoryFilterOverlay" class="pickup-filter-overlay" hidden></div>
  <div id="pickupHistoryFilterPanel" class="pickup-filter-panel" hidden>
    <div class="pickup-filter-header">
      <h3>Filters</h3>
      <button type="button" id="pickupHistoryFilterClose" aria-label="Close filters">×</button>
    </div>
    <div class="pickup-filter-body">
      <label class="history-filter"><span>Status</span><select id="pickupFilterStatus"><option value="all">All</option><option value="scheduled">Scheduled</option><option value="accepted">Accepted</option><option value="in_progress">In Progress</option><option value="collected">Collected</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label>
      <label class="history-filter"><span>Payment</span><select id="pickupFilterPayment"><option value="all">All</option><option value="pending">Payment Pending</option><option value="paid">Paid</option></select></label>
      <label class="history-filter"><span>Category</span><select id="pickupFilterCategory"><option value="all">All</option></select></label>
      <label class="history-filter"><span>Date</span><select id="pickupFilterDate"><option value="all">All Time</option><option value="today">Today</option><option value="week">This Week</option><option value="month">This Month</option><option value="last30">Last 30 Days</option><option value="custom">Custom Date</option></select></label>
      <div id="pickupCustomDateFields" hidden>
        <label class="history-filter"><span>From</span><input id="pickupFilterFrom" type="date"></label>
        <label class="history-filter"><span>To</span><input id="pickupFilterTo" type="date"></label>
      </div>
    </div>
    <div class="pickup-filter-footer">
      <button type="button" id="pickupHistoryFilterClear">Clear Filters</button>
      <button type="button" id="pickupHistoryFilterApply">Apply Filters</button>
    </div>
  </div>
  <script src="/js/api.js?v=4"></script>
  <script src="/js/auth.js?v=4"></script>
  <script src="/js/loader.js?v=4"></script>
  <script src="/js/navbar.js?v=4"></script>
  <script src="/js/history.js?v=5"></script>
  <script>
    // Stale-script guard: history.html is fresh (no-store) but JS bundles
    // cache normally. If the cached history.js predates the filter popup,
    // the Filters button would silently do nothing — surface it instead.
    window.addEventListener('load', function () {
      if (window.__historyFilters !== 'popup-v1') {
        console.error('[EcoLoop] history.js is stale (cached). Hard-refresh (Ctrl+F5) to load the filter UI.');
        var alertEl = document.getElementById('alert');
        if (alertEl && typeof showAlert === 'function') {
          showAlert(alertEl, 'This page loaded an outdated cached script. Please hard-refresh (Ctrl+F5).');
        }
      }
    });
  </script>
  <script>
    if (typeof initNavbar === 'function') initNavbar();
  </script>
</body>
</html>
